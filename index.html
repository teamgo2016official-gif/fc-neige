<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FC Neige 出欠</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;padding:14px;color:#222;background:#f4f5f7}
  .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  h1{font-size:17px;margin:0 0 4px}
  .info{color:#555;font-size:14px;line-height:1.6;margin-bottom:12px}
  .btns{display:flex;gap:8px}
  .btn{flex:1;padding:13px 0;font-size:16px;font-weight:bold;border-radius:10px;border:2px solid #ccc;background:#fff;color:#555}
  .btn.on{color:#fff}
  .msg{min-height:18px;font-size:13px;color:#06C755;text-align:center;margin:8px 0 4px}
  .msg.err{color:#d33}
  .row{font-size:14px;line-height:1.6;margin-top:6px}
  .row b{display:inline-block;min-width:92px}
  .names{color:#444}
  .none{color:#aaa}
  #loading{color:#888;text-align:center;padding:40px 0}
  #sync{display:none;background:#fff8e1;color:#8a6d00;font-size:13px;text-align:center;padding:8px;border-radius:10px;margin-bottom:12px}
</style>
</head>
<body>
<div id="sync">🔄 最新の予定・参加状況を読み込み中…</div>
<div id="loading">読み込み中…</div>
<div id="app"></div>
<script>
var LIFF_ID = '2012454075-aASmeM29';
var API_URL = 'https://script.google.com/macros/s/AKfycbxp66HBJWYZrCxLHZViBx7moL0f9IQpGQh5_cyGtP0eztNymTkaRn1clt0c_jn3wi40zg/exec';
var CACHE_KEY = 'fcneige_state_v1';
var cur = null;        // 画面に出している状態
var server = null;     // サーバーで確定した状態
var myName = null;
var msgs = {};
var seq = 0;           // 最新の送信番号（連打したら最後の操作が勝つ）
var ready;             // LIFF初期化が終わったら解決
var chain = Promise.resolve();

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function showError(m){var el=document.getElementById('loading');el.style.display='block';el.textContent=m;}
function clone(o){return JSON.parse(JSON.stringify(o));}
function saveCache(st){try{localStorage.setItem(CACHE_KEY,JSON.stringify(st));}catch(e){}}
function loadCache(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'null');}catch(e){return null;}}

// IDトークンが切れていたら、LINEにログインし直して新しいトークンをもらう
function relogin(){
  try{ if(liff.isInClient()) return false; }catch(e){}   // LINEアプリ内ではログインし直せないので、エラー表示に任せる
  try{ if(sessionStorage.getItem('relogin')) return false; sessionStorage.setItem('relogin','1'); }catch(e){}
  liff.logout(); liff.login({redirectUri: location.href.split('#')[0]});
  return true;
}
function tokenOk(){
  try{ var t=liff.getDecodedIDToken(); return t && t.exp*1000 > Date.now()+60000; }catch(e){ return false; }
}

function api(payload, retried){
  if(!tokenOk() && relogin()) return new Promise(function(){});
  payload.idToken = liff.getIDToken();
  try{ payload.accessToken = liff.getAccessToken(); }catch(e){}
  return apiOnce(payload).catch(function(e){
    // 1回目で失敗したら、少し待って自動でもう1回だけ送る
    if(retried || /締め切|不正/.test(e.message)) throw e;
    return new Promise(function(r){ setTimeout(r,1200); }).then(function(){ return api(payload,true); });
  });
}
function apiOnce(payload){
  return fetch(API_URL,{method:'POST',body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j.ok){
        if(/LINEの確認/.test(j.error||'') && relogin()) return new Promise(function(){});
        throw new Error(j.error||'エラーが発生しました');
      }
      try{ sessionStorage.removeItem('relogin'); }catch(e){}
      return j.state;
    });
}

function render(st){
  cur = st;
  document.getElementById('loading').style.display='none';
  if(!st.events.length){document.getElementById('app').innerHTML='<div class="card">今は回答受付中の予定がありません。</div>';return;}
  var h='';
  st.events.forEach(function(ev){
    h+='<div class="card"><h1>'+esc(ev.title)+'</h1><div class="info">'+ev.lines.map(esc).join('<br>')+'</div><div class="btns">';
    ev.groups.forEach(function(g){
      var on=ev.my===g.label;
      h+='<button class="btn'+(on?' on':'')+'" style="'+(on?'background:'+g.color+';border-color:'+g.color:'')+'" data-k="'+esc(ev.key)+'" data-l="'+esc(g.label)+'">'+(on?'✓ ':'')+esc(g.label)+'</button>';
    });
    var m=msgs[ev.key]||{t:(ev.my?'':'まだ回答していません'),err:false};
    h+='</div><div class="msg'+(m.err?' err':'')+'">'+esc(m.t)+'</div>';
    ev.groups.forEach(function(g){
      h+='<div class="row"><b>'+g.icon+' '+esc(g.label)+'（'+g.names.length+'）</b> '+(g.names.length?'<span class="names">'+g.names.map(esc).join('、')+'</span>':'<span class="none">なし</span>')+'</div>';
    });
    if(ev.unanswered!==null && ev.unanswered!==undefined) h+='<div class="row"><b>💤 未回答（'+ev.unanswered+'）</b></div>';
    h+='</div>';
  });
  var app=document.getElementById('app'); app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll('button'),function(el){
    el.onclick=function(){answer(el.getAttribute('data-k'),el.getAttribute('data-l'));};
  });
}

// 押した瞬間に画面を書き換える（サーバーの返事は待たない）
function applyLocal(st,key,label){
  var n=clone(st);
  n.events.forEach(function(ev){
    if(ev.key!==key) return;
    if(myName){
      ev.groups.forEach(function(g){
        if(ev.my===g.label){var i=g.names.indexOf(myName); if(i>=0) g.names.splice(i,1);}
        if(g.label===label) g.names.push(myName);
      });
    }
    if(!ev.my && typeof ev.unanswered==='number') ev.unanswered=Math.max(ev.unanswered-1,0);
    ev.my=label;
  });
  return n;
}

function answer(key,label){
  if(!cur) return;
  var my=++seq;
  msgs={}; msgs[key]={t:'「'+label+'」で保存中…',err:false};
  render(applyLocal(cur,key,label));
  chain = chain.then(function(){ return ready; })   // 連打しても1件ずつ順番に送る
    .then(function(){ return api({action:'answer',key:key,status:label}); })
    .then(function(st){
      server=st; saveCache(st);
      if(my!==seq) return;               // あとから別のボタンが押されていたら、その結果を待つ
      msgs={}; msgs[key]={t:'「'+label+'」で回答しました！',err:false};
      render(st);
    })
    .catch(function(e){
      if(my!==seq) return;
      msgs={}; msgs[key]={t:'保存できませんでした：'+e.message,err:true};
      render(server||cur);
    });
}

// 前回の内容があれば、まずそれをすぐ表示
var cached=loadCache();
if(cached){ msgs={}; render(cached); document.getElementById('sync').style.display='block'; }

ready = liff.init({liffId:LIFF_ID}).then(function(){
  if(!liff.isLoggedIn()){liff.login();return new Promise(function(){});}
  try{ var t=liff.getDecodedIDToken(); myName=t&&t.name; }catch(e){}
});
ready.then(function(){ return api({action:'state'}); })
  .then(function(st){ server=st; saveCache(st); document.getElementById('sync').style.display='none'; if(seq===0) render(st); })
  .catch(function(e){
    var b=document.getElementById('sync');
    if(cur){ b.style.display='block'; b.textContent='⚠️ 最新の状況を読み込めませんでした。画面を閉じて開き直してください。'; }
    else showError(e.message);
  });
</script>
</body>
</html>
